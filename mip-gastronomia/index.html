<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1A7A3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Supervisión MIP — Cocinas y Cafés</title>
<style>
:root{--verde:#1A7A3C;--verde-cl:#E8F5ED;--ambar:#F9A825;--rojo:#C62828;--naranja:#EF6C00;--tinta:#1F2A24;--gris:#5B6470;--linea:#D5DBD7;--fondo:#F2F5F3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#DDE4DF}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.hidden{display:none!important}

#app{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--fondo)}
.hd{flex:none;background:#fff;border-bottom:3px solid var(--verde);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;display:flex;align-items:center;gap:6px;min-height:58px}
.hd .back{width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.hd .back svg{width:24px;height:24px}
.hd .tt{min-width:0;flex:1;padding-left:2px}
.hd h1{font-size:1.1rem;color:var(--verde);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:0;font-size:.78rem;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd img{height:30px;margin-right:6px;flex:none}
.bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.ft{flex:none;background:#fff;border-top:1px solid var(--linea);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.ft button{flex:1;min-height:52px;border-radius:12px;font-weight:700;font-size:1rem;border:2px solid var(--verde)}
.ft .pri{background:var(--verde);color:#fff;flex:1.4}
.ft .sec{background:#fff;color:var(--verde)}
.kb .ft{padding-bottom:10px}

.q{font-size:1.25rem;line-height:1.25;margin:4px 0 12px}
.help{color:var(--gris);font-size:.88rem;margin:-4px 0 12px}
label.f{display:block;font-size:.8rem;color:var(--gris);font-weight:600;margin:12px 0 4px}
input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--linea);border-radius:12px;padding:12px;background:#fff;font-size:17px;min-height:50px}
textarea{min-height:96px;resize:vertical;line-height:1.35}
input:focus,textarea:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px rgba(26,122,60,.15)}

.home{text-align:center;padding-top:5vh}
.home img{width:180px;max-width:60%}
.home p{color:var(--gris);margin:14px auto 24px;max-width:340px}
.cta{display:flex;flex-direction:column;gap:12px}
.cta button{min-height:60px;border-radius:14px;border:2px solid var(--verde);background:#fff;color:var(--verde);font-weight:700;font-size:1.08rem}
.cta button.main{background:var(--verde);color:#fff}
.ok{background:var(--verde-cl);border-left:5px solid var(--verde);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:600;text-align:left}

/* captura */
.prog{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:.88rem}
.bar{height:8px;border-radius:4px;background:#E6EBE8;overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.cap{background:#fff;border:2px solid var(--verde);border-radius:14px;padding:12px}
.cap textarea{border:0;padding:4px;min-height:84px;box-shadow:none;font-size:17px}
.cap textarea:focus{box-shadow:none}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{min-height:50px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.tools .go{flex:1;background:var(--verde);color:#fff;border-color:var(--verde)}
.tools svg{width:22px;height:22px}
.mic.rec{background:var(--rojo);color:#fff;border-color:var(--rojo);animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.7}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--linea)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--tinta);color:#fff;font-size:14px;line-height:1}
.hint{font-size:.8rem;color:var(--gris);margin:8px 2px 0}
.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}
.nav3 button{min-height:56px;border:1.5px solid var(--verde);border-radius:12px;background:#fff;color:var(--verde);font-weight:700;font-size:.9rem;line-height:1.15}

/* propuesta */
.prop{background:#fff;border:1px solid var(--linea);border-left:6px solid var(--c,var(--verde));border-radius:12px;padding:12px 14px;margin-bottom:12px}
.prop .code{font-weight:800;color:var(--verde);margin-right:6px}
.prop .ti{font-weight:700}
.prop .ob{font-size:.82rem;color:var(--gris);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;border:1.5px solid var(--linea);border-radius:21px;background:#fff;padding:0 14px;font-size:.9rem;font-weight:600}
.chips button.on{background:var(--c,var(--verde));border-color:var(--c,var(--verde));color:#fff}
.alt{margin-top:8px}
.alt button{font-weight:500;font-size:.82rem;min-height:36px}
.lbl{font-size:.8rem;color:var(--gris);font-weight:600;margin:14px 2px 6px}

/* listas */
.sech{font-family:Georgia,serif;font-size:1.02rem;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sech button{min-height:36px;border:1.5px solid var(--verde);border-radius:9px;background:#fff;color:var(--verde);font-weight:700;font-size:.78rem;padding:0 10px;flex:none;font-family:system-ui,sans-serif}
.card{background:#fff;border:1px solid var(--linea);border-radius:12px;margin-bottom:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:9px 12px;border:0;border-bottom:1px solid #EEF1EF;background:#fff;text-align:left}
.row:last-child{border-bottom:0}
.row .cd{font-weight:800;font-size:.8rem;color:var(--verde);width:38px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:.95rem;line-height:1.25}
.row .tx small{display:block;color:var(--gris);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row img{width:46px;height:46px;object-fit:cover;border-radius:6px;flex:none}
.st{flex:none;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:5px;color:#fff;white-space:nowrap}
.st.none{background:#EEF1EF;color:#8A938D}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;font-weight:700;font-size:.82rem;padding:0 4px;line-height:1.1}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.bigt{font-weight:700;font-size:1.05rem;line-height:1.3}
.obs{font-size:.85rem;color:var(--gris);margin:6px 0 4px}
.fl{display:flex;gap:8px;align-items:flex-start}
.fl textarea,.fl input{flex:1}
.mini{width:50px;height:50px;flex:none;border:1.5px solid var(--linea);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.mini svg{width:22px;height:22px}
.mini.rec{background:var(--rojo);border-color:var(--rojo);color:#fff}
.add1{width:100%;min-height:50px;border:2px dashed var(--verde);border-radius:12px;background:#fff;color:var(--verde);font-weight:700;margin-top:8px}
.nota{font-size:.78rem;color:var(--gris);margin:10px 2px 0}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (min-width:660px){#app{border-left:1px solid var(--linea);border-right:1px solid var(--linea)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- informe (vista previa e impresión) ---------- */
.rep{background:#fff;color:#20242a;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;padding:18px;border-radius:8px;box-shadow:0 1px 6px #0001}
.rep h1{font-family:Georgia,serif;font-size:20px;color:var(--verde);margin:0}
.rep h2{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.02em;margin:20px 0 8px;border-bottom:2px solid var(--verde);padding-bottom:4px;text-transform:uppercase;break-after:avoid}
.rep h3{font-family:Arial,sans-serif;font-size:12px;margin:0 0 4px;color:var(--verde)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--verde);padding-bottom:10px;margin-bottom:12px}
.rhead img{height:46px}
.rhead .r{text-align:right}
.rhead .r p{margin:2px 0 0;color:#69717a;font-size:10.5px}
.rmeta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 14px;margin-bottom:12px}
.rmeta div span{display:block;font-size:9.5px;color:#69717a}
.rmeta div b{font-size:12px}
.lect{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 10px;border-left:4px solid var(--c,var(--verde));background:#f6f8f9;margin-bottom:12px}
.lect .sem{font-weight:800;color:var(--c)}
.kp{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-weight:700;font-size:11px}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pan{border:1px solid var(--linea);border-radius:6px;padding:9px 10px;background:#f7f9f8;break-inside:avoid;white-space:pre-wrap}
.pan.w{grid-column:1/-1}
.ptab{width:100%;border-collapse:collapse;font-size:11px}
.ptab th{background:var(--verde);color:#fff;text-align:left;padding:5px 6px;font-weight:700}
.ptab td{border-bottom:1px solid var(--linea);padding:5px 6px;vertical-align:top}
.ptab tr{break-inside:avoid}
.ri{border:1px solid var(--linea);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px;margin:8px 0;break-inside:avoid}
.ri .h{display:flex;gap:8px;align-items:flex-start}
.ri .h .cd{font-weight:800;color:var(--verde);min-width:36px}
.ri .h .t{flex:1;font-weight:700}
.ri .d{margin:5px 0 0 44px}
.ri .d p{margin:3px 0}
.ri .ph{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 44px}
.ri .ph img{width:150px;height:112px;object-fit:cover;border-radius:4px;border:1px solid var(--linea)}
.okl{margin:6px 0 0;padding:0;list-style:none;columns:2;column-gap:18px;font-size:11px;color:#3d4a42}
.okl li{break-inside:avoid;margin-bottom:2px}
.okl b{color:var(--verde)}
.rfoot{margin-top:22px;padding-top:8px;border-top:1px solid var(--linea);font-size:9.5px;color:#69717a}
@media (max-width:520px){.rmeta{grid-template-columns:1fr 1fr}.pans{grid-template-columns:1fr}.okl{columns:1}.ri .d,.ri .ph{margin-left:0}.ri .ph img{width:46%;height:auto;aspect-ratio:4/3}}
@media print{
  @page{size:A4;margin:12mm}
  html,body{height:auto;overflow:visible;background:#fff}
  #app{position:static;height:auto!important;max-width:none;border:0;background:#fff;display:block}
  .hd,.ft,.toast,.noprint{display:none!important}
  .bd{overflow:visible;padding:0}
  .rep{box-shadow:none;padding:0;border-radius:0}
  .rmeta{grid-template-columns:1fr 1fr 1fr}.pans{grid-template-columns:1fr 1fr}.okl{columns:2}
  .ri .d,.ri .ph{margin-left:44px}.ri .ph img{width:150px;height:112px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="hd">
    <button class="back" id="hBack" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tt"><h1 id="hTitle"></h1><p id="hSub"></p></div>
    <img id="hLogo" alt="">
  </header>
  <main class="bd" id="bd"></main>
  <footer class="ft" id="ft"></footer>
</div>
<input type="file" id="inCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="inGal" accept="image/*" multiple class="hidden">
<input type="file" id="inJson" accept=".json,application/json" class="hidden">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var STOP=" de la el los las del en un una con por para que se al y o a lo su sus hay muy mas pero como esta estan este esto son sin no bajo debajo detras arriba encima junto cerca sector zona area queda ";
function stem(w){return w.length>4?w.replace(/(es|s)$/,""):w;}
var KIDX=null;
function buildK(){KIDX=CHECK.map(function(c){
  var raw=norm(c.k),words=raw.split(/\s+/).filter(function(x){return STOP.indexOf(" "+x+" ")<0;});
  var phr=[];/* frases de 2+ palabras definidas implícitamente: pares consecutivos útiles */
  ["bajo mesada","cielo raso","mosca fruta","area residuos","agua estancada","materia prima","envase danado","bolsa rota","visita anterior","sigue igual","baja rotacion","puerta trasera","rejilla piso"].forEach(function(p){if(raw.indexOf(p)>=0)phr.push(p);});
  return {c:c,w:words.map(stem),phr:phr,wt:c.w||2};});}
function tokens(t){return norm(t).split(/[^a-z0-9ñ]+/).filter(function(x){return x.length>2&&STOP.indexOf(" "+x+" ")<0;}).map(stem);}
function score(text){
  if(!KIDX)buildK();
  var nt=norm(text).replace(/\b(de la|del|de los|de las|la|el|los|las)\s+/g,""),ts=tokens(text);
  return KIDX.map(function(e){
    var sc=0,used={};
    e.phr.forEach(function(p){if(nt.indexOf(p)>=0)sc+=e.wt+2;});
    ts.forEach(function(t){for(var i=0;i<e.w.length;i++){var w=e.w[i];
      if(!used[w]&&(w===t||(t.length>=5&&w.indexOf(t)===0)||(w.length>=5&&t.indexOf(w)===0))){used[w]=1;sc+=e.wt;break;}}});
    return {id:e.c.id,sc:sc};
  }).filter(function(x){return x.sc>0;}).sort(function(a,b){return b.sc-a.sc;});
}
/* si la nota menciona actividad de plagas, ese es el hallazgo; el lugar es sólo dónde ocurre */

function rank(text){var r=score(text),i;for(i=0;i<r.length;i++)if(ACT.indexOf(r[i].id)>=0)break;if(i>0&&i<r.length)r.unshift(r.splice(i,1)[0]);return r;}

function interpret(text){
  var raw=String(text||"").trim(),nt=norm(raw),r={raw:raw};
  /* comandos */
  var pm=/^(actividad|estado de actividad|predisponentes|condiciones predisponentes|condiciones|gestion|gestion mip|principales|puntos de atencion|acciones|acciones prioritarias|evolucion|conclusion|conclusion tecnica)\s*[:,.-]\s*/.exec(nt);
  if(pm){var map={actividad:"actividad","estado de actividad":"actividad",predisponentes:"predisponentes","condiciones predisponentes":"predisponentes",condiciones:"predisponentes",gestion:"gestion","gestion mip":"gestion",principales:"principales","puntos de atencion":"principales",acciones:"acciones","acciones prioritarias":"acciones",evolucion:"evolucion",conclusion:"conclusion","conclusion tecnica":"conclusion"};
    return {panel:map[pm[1]],text:cap1(raw.slice(pm[0].length))};}
  if(/(todo|resto|demas)\b.*\b(conforme|bien|en orden|sin novedad)/.test(nt)&&raw.length<60)return {restoConforme:true};
  /* punto del checklist */
  var cm=/\b([ihaemg])\s*-?\s*0?([1-6])\b/.exec(nt),cands=rank(raw);
  if(cm&&chk(cm[1].toUpperCase()+"-0"+cm[2])){var fid=cm[1].toUpperCase()+"-0"+cm[2];cands=[{id:fid,sc:99}].concat(cands.filter(function(x){return x.id!==fid;}));}
  r.cands=cands.slice(0,4).map(function(x){return x.id;});
  r.id=r.cands[0]||null;
  /* estado */
  if(/\b(no aplica|n\/a)\b/.test(nt))r.estado="N/A";
  else if(/\b(critic|grave|urgente|infestaci|abundante|muchas|muchos|nido|colonia|vivas|vivos|activa intensa)/.test(nt))r.estado="Crítico";
  else if(/\b(conforme|sin novedad|sin evidencia|sin actividad|sin rastros|no se observa|no se detecta|en buen estado|en orden|todo bien|correcto|correcta|ok)\b/.test(nt))r.estado="Conforme";
  else r.estado="Requiere atención";
  /* prioridad */
  var pr=/prioridad\s+(alta|media|baja)/.exec(nt);
  r.prioridad=pr?cap1(pr[1]):r.estado==="Crítico"?"Alta":r.estado==="Requiere atención"?"Media":"";
  /* responsable */
  var RSX=/(responsable|a cargo|corri[gj]\w*|resuelv\w*|resolver|ocup\w*|encarg\w*|lo hace|hacerlo)\s+(de\s+|del\s+|el\s+|la\s+|por\s+)?(local|mip|gestam|nosotros|ambos)/;
  var rs=RSX.exec(nt);
  r.responsable=rs?(rs[3]==="local"?"Local":rs[3]==="ambos"?"Ambos":"MIP"):"";
  /* plazo */
  var d=null,m;
  if(/\b(inmediat|hoy|en el dia)/.test(nt))d=0;
  else if((m=/\b(\d{1,3}|un|una|dos|tres|cuatro|cinco|siete|diez|quince|veinte|treinta)\s+(dia|semana|mes)/.exec(nt))){var n=+m[1]||NUM[m[1]]||1;d=m[2]==="dia"?n:m[2]==="semana"?n*7:n*30;}
  else if(/esta semana/.test(nt))d=7;
  r.fecha=d==null?"":plusDays(d);
  /* observación: texto sin las indicaciones de control */
  var obs=raw.replace(/,?\s*(con\s+)?prioridad\s+(alta|media|baja)/ig,"")
    .replace(/,?\s*(que\s+)?(lo\s+|la\s+|los\s+)?(responsable|a cargo|corri[gj]\S*|resuelv\S*|resolver|ocup\S*|encarg\S*|hace|hacerlo)\s+(de\s+|del\s+|el\s+|la\s+|por\s+)?(local|mip|gestam|nosotros|ambos)\b/ig,"")
    .replace(/,?\s*(en|dentro de|plazo( de)?)\s+(\d{1,3}|un|una|dos|tres|cuatro|cinco|siete|diez|quince|veinte|treinta)\s+(d[ií]as?|semanas?|mes(es)?)/ig,"")
    .replace(/,\s*(es\s+)?(cr[ií]tico|requiere atenci[oó]n|conforme|urgente|grave)\s*(?=,|$)/ig,"")
    .replace(/^\s*[ihaemgIHAEMG]\s*-?\s*0?[1-6]\s*[:,.-]?\s*/,"")
    .replace(/[\s,;.]+$/,"");
  r.obs=cap1(obs);
  return r;
}

  var c=chk(dr.id);if(!c)return;var x=C(c.id),prob=dr.estado==="Crítico"||dr.estado==="Requiere atención";

  if(prob){if(!x.accion)x.accion=c.a;x.responsable=dr.responsable||x.responsable||c.r;x.fecha=dr.fecha||x.fecha||plusDays(x.prioridad==="Alta"?7:x.prioridad==="Media"?15:30);}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
var IMIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
var ICAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>';
var IGAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>';
function stopRec(){if(rec){try{rec.stop();}catch(e){}}}
function dictate(btn,ta){
  if(!SR){toast("Este navegador no dicta: usá el micrófono del teclado.",3500);ta.focus();return;}
  if(rec){stopRec();return;}
  var base=ta.value.replace(/\s+$/,""),fin="";
  rec=new SR();rec.lang="es-AR";rec.interimResults=true;rec.continuous=true;
  rec.onresult=function(e){var inter="";for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else inter+=t;}
    ta.value=(base?base+" ":"")+(fin+inter).trim();ta.dispatchEvent(new Event("input"));};
  rec.onerror=function(e){if(e.error==="not-allowed")toast("Sin permiso para usar el micrófono.");};
  rec.onend=function(){rec=null;btn.classList.remove("rec");};
  try{rec.start();btn.classList.add("rec");}catch(e){rec=null;}
}

function back(){stopRec();if(stack.length<=1)return;stack.pop();skipPop++;try{history.back();}catch(e){skipPop--;}draw();}
window.addEventListener("popstate",function(){if(skipPop){skipPop--;return;}if(stack.length>1){stopRec();stack.pop();draw();}});

        if(p){if(!x.prioridad||x.estado==="Crítico")x.prioridad=x.estado==="Crítico"?"Alta":"Media";if(!x.accion)x.accion=c.a;if(!x.responsable)x.responsable=c.r;if(!x.fecha)x.fecha=plusDays(x.prioridad==="Alta"?7:15);}
        else x.prioridad="";redraw();});
      on("[data-pr]",function(el){sync();x.prioridad=el.dataset.pr;redraw();});
      on("[data-rs]",function(el){sync();x.responsable=el.dataset.rs;redraw();});
      on("[data-pz]",function(el){sync();x.fecha=plusDays(+el.dataset.pz);redraw();});
      on("[data-a=sug]",function(){sync();x.accion=c.a;redraw();});
      on("[data-ip]",function(el){sync();x.photos.splice(+el.dataset.ip,1);redraw();});
      on("[data-a=cam]",function(){sync();photoTarget=x;$("inCam").click();});
      on("[data-a=gal]",function(){sync();photoTarget=x;$("inGal").click();});
      on("[data-a=clr]",function(){if(!confirm("¿Borrar estado, observación, acción y fotos de este punto?"))return;S.checks[c.id]=blankCheck();redraw();});
    }};
};

/* ---------- resumen ejecutivo: borrador automático ---------- */
function pl(n,a,b){return n+" "+(n===1?a:b);}
function yJoin(a){return a.length>1?a.slice(0,-1).join(", ")+" y "+a[a.length-1]:a.join("");}
function lower1(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function firstLine(s){return String(s||"").split("\n")[0].trim();}
function autoPanels(){
  var P={},pb=problems(),n=counts(),sem=semaforo();
  P.actividad=["M-01","M-02","M-03","M-04"].map(function(id){var c=chk(id),x=C(id);if(!x.estado||x.estado==="N/A")return null;
    return c.s+": "+(x.estado==="Conforme"?"sin evidencias en la visita.":lower1(x.estado)+(x.obs?" — "+lower1(firstLine(x.obs)):"")+".");}).filter(Boolean).join("\n");
  P.predisponentes=pb.filter(function(c){return "IHAE".indexOf(c.id.charAt(0))>=0;}).slice(0,4).map(function(c){var x=C(c.id);return "• "+c.s+(x.obs?": "+lower1(firstLine(x.obs)):"")+".";}).join("\n");
  var GI=["M-05","M-06","G-01","G-02","G-03","G-04","G-05"],gok=[];
  P.gestion=GI.map(function(id){var c=chk(id),x=C(id);if(!x.estado||x.estado==="N/A")return null;
    if(x.estado==="Conforme"&&!x.obs){gok.push(lower1(c.s));return null;}
    return "• "+c.s+": "+lower1(x.estado)+(x.obs?" — "+lower1(firstLine(x.obs)):"")+".";}).filter(Boolean).join("\n");
  if(gok.length)P.gestion+=(P.gestion?"\n":"")+"Sin observaciones: "+yJoin(gok)+".";
  P.principales=pb.slice(0,6).map(function(c){var x=C(c.id);return "• ["+(x.estado==="Crítico"?"Crítico":"Atención")+"] "+c.s+(x.obs?": "+lower1(firstLine(x.obs)):"")+".";}).join("\n");
  P.acciones=pb.slice(0,8).map(function(c){var x=C(c.id);return "• "+(x.accion||c.a).replace(/\.$/,"")+" (responsable: "+(x.responsable||c.r)+(x.fecha?"; plazo: "+fmtF(x.fecha):"")+").";}).join("\n");
  var g3=C("G-03");P.evolucion=g3.obs||"";
  var act=["M-01","M-02","M-03","M-04"].filter(function(id){var e=C(id).estado;return e==="Crítico"||e==="Requiere atención";}).map(function(id){return lower1(chk(id).s);});
  var fac=pb.filter(function(c){return "IHAE".indexOf(c.id.charAt(0))>=0;}).slice(0,3).map(function(c){return lower1(c.s);});
  var con="Estado general: "+lower1(sem.l)+". Se evaluaron "+n.ev+" puntos: "+pl(n["Conforme"],"conforme","conformes")+", "+pl(n["Requiere atención"],"que requiere atención","que requieren atención")+" y "+pl(n["Crítico"],"crítico","críticos")+".";
  con+=act.length?" Se registra actividad de "+yJoin(act)+".":n.ev?" No se registraron evidencias de actividad durante la visita.":"";
  if(fac.length)con+=(fac.length===1?" El factor que más influye sobre el riesgo actual es: ":" Los factores que más influyen sobre el riesgo actual son: ")+yJoin(fac)+".";
  if(pb.length)con+=" Prioridades: "+pb.slice(0,3).map(function(c){return lower1((C(c.id).accion||c.a).replace(/\.$/,""));}).join("; ")+".";
  P.conclusion=n.ev?con:"";
  return P;
}
SCR.res=function(){
  var h='<p class="help">Podés dictar cada panel o generar un borrador con lo cargado en el checklist y ajustarlo.</p>'+
    '<div class="seg" style="margin-bottom:6px"><button data-a="auto" style="--c:#1A7A3C" class="on">Completar vacíos</button><button data-a="redo">Rehacer todo</button></div>';
  PANELES.forEach(function(p){
    h+='<label class="f" for="p_'+p.k+'">'+esc(p.t)+'</label><div class="fl"><textarea id="p_'+p.k+'" placeholder="'+esc(p.ph)+'" rows="'+(p.k==="conclusion"?6:4)+'">'+esc(S.panels[p.k])+'</textarea><button class="mini" type="button" data-mic="p_'+p.k+'" aria-label="Dictar">'+IMIC+'</button></div>';
  });
  function sync(){PANELES.forEach(function(p){S.panels[p.k]=$("p_"+p.k).value.trim();});}
  return {title:"Resumen ejecutivo",sub:"Paneles del informe",html:h,
    act:[{l:"Vista previa",p:1,fn:function(){sync();go({s:"pre"});}}],
    bind:function(){
      qa("textarea").forEach(function(t){t.addEventListener("input",function(){sync();scheduleSave();});});
      on("[data-a=auto]",function(){sync();var P=autoPanels(),k=0;PANELES.forEach(function(p){if(!S.panels[p.k]&&P[p.k]){S.panels[p.k]=P[p.k];k++;}});toast(k?k+" paneles completados":"No hay paneles vacíos con datos para completar");redraw();});
      on("[data-a=redo]",function(){if(!confirm("¿Reemplazar todos los paneles por el borrador automático?"))return;var P=autoPanels();PANELES.forEach(function(p){S.panels[p.k]=P[p.k]||"";});redraw();});
    }};
};

/* ---------- informe ---------- */
function reportHtml(){
  var m=S.meta,n=counts(),sem=semaforo(),pb=problems(),P=S.panels;
  var h='<div class="rep"><div class="rhead"><img src="'+LOGO+'" alt="Gestam"><div class="r"><h1>'+esc(TITULO)+'</h1><p>'+esc(SUBT)+'</p><p>Consultora Gestam MDP S.A. — Manejo integrado de plagas — Mar del Plata</p></div></div>';
  h+='<div class="rmeta">'+[["Cliente / cadena",m.cliente],["Local",m.local],["Período",m.periodo],["Dirección",m.direccion],["Fecha de visita",fmtF(m.fechaVisita)],["Responsable del local",m.encargado],["Realizado por",m.por]]
    .map(function(r){return '<div><span>'+r[0]+'</span><b>'+esc(r[1]||"—")+'</b></div>';}).join("")+'</div>';
  h+='<div class="lect" style="--c:'+sem.c+'"><b>Lectura ejecutiva:</b> <span class="sem">'+esc(sem.l)+'</span> · '+n.ev+' puntos evaluados'+
    ESTADOS.map(function(e){return n[e.k]?' <span class="kp" style="background:'+e.c+'">'+n[e.k]+" "+esc(e.k==="Conforme"?(n[e.k]===1?"conforme":"conformes"):e.k==="Crítico"?(n[e.k]===1?"crítico":"críticos"):e.k==="N/A"?"N/A":(n[e.k]===1?"requiere atención":"requieren atención"))+'</span>':"";}).join("")+'</div>';
  var pans=PANELES.filter(function(p){return p.k!=="conclusion"&&P[p.k];});
  if(pans.length)h+='<h2>Estado de situación</h2><div class="pans">'+pans.map(function(p,i){return '<div class="pan'+(i===pans.length-1&&pans.length%2?" w":"")+'"><h3>'+esc(p.t)+'</h3>'+esc(P[p.k])+'</div>';}).join("")+'</div>';
  if(pb.length){
    h+='<h2>Plan de acción</h2><table class="ptab"><thead><tr><th>Punto</th><th>Estado</th><th>Acción requerida</th><th>Responsable</th><th>Fecha objetivo</th></tr></thead><tbody>'+
      pb.map(function(c){var x=C(c.id),e=estOf(x.estado);return '<tr><td><b>'+c.id+'</b> '+esc(c.s)+'</td><td><span class="kp" style="background:'+e.c+'">'+esc(e.sh)+'</span>'+(x.prioridad?'<br><small>Prioridad '+esc(x.prioridad.toLowerCase())+'</small>':"")+'</td><td>'+esc(x.accion||c.a)+'</td><td>'+esc(x.responsable||c.r)+'</td><td>'+esc(fmtF(x.fecha)||"—")+'</td></tr>';}).join("")+'</tbody></table>';
  }
  SECC.forEach(function(s){
    var its=CHECK.filter(function(c){return c.id.charAt(0)===s.k&&C(c.id).estado;});if(!its.length)return;
    var det=its.filter(function(c){var x=C(c.id);return x.estado!=="Conforme"&&x.estado!=="N/A"||x.obs||x.photos.length;});
    var oks=its.filter(function(c){return det.indexOf(c)<0;});
    h+='<h2>'+esc(s.n)+'</h2>';
    det.forEach(function(c){var x=C(c.id),e=estOf(x.estado);
      h+='<div class="ri" style="--c:'+e.c+'"><div class="h"><span class="cd">'+c.id+'</span><span class="t">'+esc(c.t)+'</span><span class="kp" style="background:'+e.c+'">'+esc(e.sh)+'</span></div><div class="d">'+
        (x.prioridad?'<p><b>Prioridad:</b> '+esc(x.prioridad)+'</p>':"")+
        (x.obs?'<p><b>Hallazgo:</b> '+esc(x.obs).replace(/\n/g,"<br>")+'</p>':"")+
        ((x.estado==="Crítico"||x.estado==="Requiere atención")?'<p><b>Acción requerida:</b> '+esc(x.accion||c.a)+'</p><p><b>Responsable:</b> '+esc(x.responsable||c.r)+(x.fecha?' · <b>Fecha objetivo:</b> '+fmtF(x.fecha):"")+'</p>':"")+
        '</div>'+(x.photos.length?'<div class="ph">'+x.photos.map(function(p){return '<img src="'+p.img+'" alt="">';}).join("")+'</div>':"")+'</div>';});
    if(oks.length)h+='<ul class="okl">'+oks.map(function(c){return '<li><b>'+c.id+'</b> '+esc(c.s)+' — '+esc(C(c.id).estado)+'</li>';}).join("")+'</ul>';
  });
  var noev=CHECK.length-n.ev;
  if(noev&&n.ev)h+='<p class="rfoot" style="border:0;margin-top:10px">Puntos no evaluados en esta visita: '+noev+'.</p>';
  if(P.conclusion)h+='<h2>Conclusión técnica</h2><div class="pan w">'+esc(P.conclusion)+'</div>';
  h+='<div class="rfoot">'+esc(PIE)+'</div></div>';
  return h;
}
SCR.pre=function(){
  return {title:"Vista previa del informe",sub:"Así lo recibe el cliente",
    html:'<p class="help noprint">Para el PDF: Imprimir → Guardar como PDF. Los puntos sin evaluar no se muestran.</p>'+reportHtml()+
      '<div class="seg noprint" style="margin-top:14px"><button data-a="exp">Exportar datos (.json)</button><button data-a="datos">Editar datos</button></div>'+
      '<p class="nota noprint">El archivo de datos se puede abrir en esta app o importar en el Consolidador MIP.</p>',
    act:[{l:"Checklist",fn:function(){go({s:"chk"});}},{l:"Imprimir / PDF",p:1,fn:function(){saveNow();window.print();}}],
    bind:function(){on("[data-a=exp]",exportJSON);on("[data-a=datos]",function(){go({s:"datos"});});}};
};

/* ---------- fotos ---------- */
var photoTarget=null,MAXS=1280,Q=0.8;
$("inCam").addEventListener("change",onFiles);$("inGal").addEventListener("change",onFiles);
function onFiles(e){var fs=Array.prototype.slice.call(e.target.files||[]);e.target.value="";if(!fs.length)return;
  var tgt=photoTarget,i=0;photoTarget=null;
  (function next(){if(i>=fs.length){$("toast").classList.remove("show");redraw();return;}
    toast("Procesando foto "+(i+1)+" de "+fs.length+"…",0);
    processFile(fs[i++]).then(function(p){(tgt?tgt.photos:pend).push(p);}).catch(function(){toast("No se pudo leer una foto.");}).then(next);})();
}
function processFile(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){URL.revokeObjectURL(u);var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,MAXS/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    res({img:c.toDataURL("image/jpeg",Q),w:c.width,h:c.height});};
  im.onerror=function(){URL.revokeObjectURL(u);rej();};im.src=u;});}

/* ---------- archivo de datos (compatible con el Consolidador MIP) ---------- */
var APP="Gestam-MIP-Gastronomia";
function slug(s){return norm(s||"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40)||"local";}
function toExport(){
  var meta={};["cliente","local","periodo","direccion","fechaVisita","encargado"].forEach(function(k){meta[k]=S.meta[k]||"";});
  PANELES.forEach(function(p){meta[p.k]=S.panels[p.k]||"";});
  return {app:APP,v:1,meta:meta,por:S.meta.por||"",
    checks:CHECK.map(function(c){var x=C(c.id);return {id:c.id,estado:x.estado,prioridad:x.prioridad,obs:x.obs,accion:x.accion,responsable:x.responsable,fecha:x.fecha,photos:x.photos.map(function(p){return p.img;})};}),
    log:S.log,savedAt:new Date().toISOString()};
}
function download(blob,name){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}
function exportJSON(){download(new Blob([JSON.stringify(toExport())],{type:"application/json"}),"MIP_"+slug(S.meta.local||S.meta.cliente)+"_"+(S.meta.fechaVisita||today())+".json");toast("Datos exportados");}
function str(v){return typeof v==="string"?v:"";}
function fromExport(o){
  if(!o||typeof o.meta!=="object"||!Array.isArray(o.checks))throw new Error("fmt");
  var s=blank(),m=o.meta;
  ["cliente","local","periodo","direccion","fechaVisita","encargado"].forEach(function(k){s.meta[k]=str(m[k]);});
  s.meta.por=str(o.por);if(!s.meta.fechaVisita)s.meta.fechaVisita=today();
  PANELES.forEach(function(p){s.panels[p.k]=str(m[p.k]);});
  o.checks.forEach(function(d){if(!d||!s.checks[d.id])return;var x=s.checks[d.id];
    x.estado=estOf(d.estado)?d.estado:"";x.prioridad=prioOf(d.prioridad)?d.prioridad:"";
    ["obs","accion","responsable","fecha"].forEach(function(k){x[k]=str(d[k]);});
    x.photos=(Array.isArray(d.photos)?d.photos:[]).map(function(p){return typeof p==="string"?p:p&&p.img;}).filter(function(p){return /^data:image\//.test(p||"");}).map(function(p){return {img:p};});});
  s.log=Array.isArray(o.log)?o.log.filter(function(l){return l&&chk(l.id);}).slice(0,40):[];
  return s;
}
$("inJson").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  var r=new FileReader();r.onload=function(){try{S=fromExport(JSON.parse(r.result));draft=null;pend=[];stack=[{s:"home"}];go({s:"cap"});toast("Datos abiertos");}catch(err){toast("El archivo no tiene el formato esperado.",4000);}};r.readAsText(f);});

/* ---------- respaldo automático (IndexedDB) ---------- */
var db=null,sT;
function hasData(){return !!(S.meta.cliente||evaluated().length||S.log.length);}
function saveNow(){clearTimeout(sT);if(!db)return;try{var os=db.transaction("kv","readwrite").objectStore("kv");if(hasData())os.put({app:APP,s:S,pend:pend,t:Date.now()},"actual");else os.delete("actual");}catch(e){}}
function scheduleSave(){clearTimeout(sT);sT=setTimeout(saveNow,300);}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveNow();});
window.addEventListener("pagehide",saveNow);
(function(){try{if(!window.indexedDB)return;var rq=indexedDB.open("gestam-mip-gastronomia",1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore("kv");};
  rq.onsuccess=function(){db=rq.result;try{var g=db.transaction("kv").objectStore("kv").get("actual");
    g.onsuccess=function(){var o=g.result;if(o&&o.s&&!hasData()&&cur().s==="home"){try{var b=blank();
      Object.keys(b.meta).forEach(function(k){b.meta[k]=str((o.s.meta||{})[k])||b.meta[k];});
      PANELES.forEach(function(p){b.panels[p.k]=str((o.s.panels||{})[p.k]);});
      CHECK.forEach(function(c){var x=(o.s.checks||{})[c.id];if(x)b.checks[c.id]=x;});
      b.log=o.s.log||[];S=b;pend=o.pend||[];draw();}catch(e){}}};}catch(e){}};}catch(e){}})();

function fitVV(){if(!vv)return;app.style.height=vv.height+"px";app.style.top=vv.offsetTop+"px";app.classList.toggle("kb",vv.height<window.innerHeight*0.8);}
if(vv){vv.addEventListener("resize",fitVV);vv.addEventListener("scroll",fitVV);}
window.addEventListener("beforeprint",function(){app.style.height="";app.style.top="";});

try{history.replaceState({n:1},"");}catch(e){}
draw();fitVV();
window.MipGastro={state:function(){return S;},interpret:interpret,applyDraft:applyDraft,autoPanels:autoPanels,reportHtml:reportHtml,toExport:toExport,fromExport:fromExport,go:go};
})();
